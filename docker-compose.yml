services:
  db:
    image: postgres:16
    container_name: webhookcity-db
    environment:
      POSTGRES_DB: webhookcity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhookcity"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./apps/api
    container_name: webhookcity-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Inside the compose network Postgres is reachable by its service name "db".
      ConnectionStrings__Default: "Host=db;Port=5432;Database=webhookcity;Username=postgres;Password=postgres"
    ports:
      - "5000:8080"

  web:
    build:
      context: ./apps/web
      args:
        # Baked into the client bundle; the browser reaches the API on the host port.
        NEXT_PUBLIC_API_URL: "http://localhost:5000"
    container_name: webhookcity-web
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
